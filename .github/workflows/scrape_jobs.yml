name: Daily Job Scraper

on:
  schedule:
    # 5:40 AM IST is 00:10 UTC (5:40 - 05:30 = 00:10 UTC)
    - cron: '10 0 * * *'
  # Allows manual triggers anytime from GitHub Actions UI tab
  workflow_dispatch:

jobs:
  scrape-and-update:
    name: Run Scrapers and Update Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./BE

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium with OS dependencies
        run: |
          playwright install chromium --with-deps

      - name: Install Xvfb for headed browser
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils

      - name: Start Xvfb
        # xvfb-run's own readiness check (poll a lock file, then just go) has
        # proven unreliable on this runner image: Chromium still hit "Missing
        # X server or $DISPLAY" with it in front of the command. Start Xvfb
        # ourselves, export DISPLAY for every later step via $GITHUB_ENV, and
        # block until the socket really accepts connections before Python
        # ever launches a browser.
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "[ok] Xvfb is accepting connections on :99 (waited ${i}00ms)"
              exit 0
            fi
            sleep 0.5
          done
          echo "[x] Xvfb never came up on :99" >&2
          exit 1

      - name: Execute Scrapers
        env:
          HEADLESS: "false"
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          FOUNDIT_MSSOAT: ${{ secrets.FOUNDIT_MSSOAT }}
          FOUNDIT_MSSOCLIENT: ${{ secrets.FOUNDIT_MSSOCLIENT }}
          INSTAHYRE_EMAIL: ${{ secrets.INSTAHYRE_EMAIL }}
          INSTAHYRE_PASSWORD: ${{ secrets.INSTAHYRE_PASSWORD }}
        run: |
          echo "DISPLAY is $DISPLAY"
          python main.py --all

      - name: Upload scraper debug snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-output
          path: BE/debug_output/
          if-no-files-found: ignore
          retention-days: 5

