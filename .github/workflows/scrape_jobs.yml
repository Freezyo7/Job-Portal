name: Daily Job Scraper

on:
  schedule:
    # 5:40 AM IST is 00:10 UTC (5:40 - 05:30 = 00:10 UTC)
    - cron: '10 0 * * *'
  # Allows manual triggers anytime from GitHub Actions UI tab
  workflow_dispatch:

jobs:
  scrape-and-update:
    name: Run Scrapers and Update Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./BE

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium with OS dependencies
        run: |
          playwright install chromium --with-deps

      - name: Install Xvfb for headed browser
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils

      - name: Start Xvfb
        # Start Xvfb ourselves rather than via xvfb-run: export DISPLAY for
        # every later step through $GITHUB_ENV, and block until the server
        # really accepts connections before Python ever launches a browser.
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "[ok] Xvfb is accepting connections on :99"
              exit 0
            fi
            sleep 0.5
          done
          echo "[x] Xvfb never came up on :99" >&2
          exit 1

      - name: Restore saved browser sessions
        # Naukri and LinkedIn OTP/checkpoint any fresh credential login from a
        # datacenter IP, so CI must reuse a session that was logged in from a
        # trusted machine instead. Seed it from base64-encoded secrets.
        env:
          NAUKRI_SESSION_B64: ${{ secrets.NAUKRI_SESSION_B64 }}
          LINKEDIN_SESSION_B64: ${{ secrets.LINKEDIN_SESSION_B64 }}
        run: |
          mkdir -p scrapers/cred
          if [ -n "$NAUKRI_SESSION_B64" ]; then
            echo "$NAUKRI_SESSION_B64" | base64 -d > scrapers/cred/naukri_session.json
            echo "[ok] restored Naukri session"
          else
            echo "[warn] NAUKRI_SESSION_B64 secret not set; Naukri will try a fresh login (expect OTP)"
          fi
          if [ -n "$LINKEDIN_SESSION_B64" ]; then
            echo "$LINKEDIN_SESSION_B64" | base64 -d > scrapers/linkedin/linkedin_cred.json
            echo "[ok] restored LinkedIn session"
          else
            echo "[warn] LINKEDIN_SESSION_B64 secret not set; LinkedIn will try a fresh login (expect checkpoint)"
          fi

      - name: Execute Scrapers
        env:
          HEADLESS: "false"
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          FOUNDIT_MSSOAT: ${{ secrets.FOUNDIT_MSSOAT }}
          FOUNDIT_MSSOCLIENT: ${{ secrets.FOUNDIT_MSSOCLIENT }}
          INSTAHYRE_EMAIL: ${{ secrets.INSTAHYRE_EMAIL }}
          INSTAHYRE_PASSWORD: ${{ secrets.INSTAHYRE_PASSWORD }}
        run: |
          echo "DISPLAY is $DISPLAY"
          python main.py --all

      - name: Upload scraper debug snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-output
          path: BE/debug_output/
          if-no-files-found: ignore
          retention-days: 5
