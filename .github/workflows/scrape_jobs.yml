name: Daily Job Scraper

on:
  schedule:
    # 5:40 AM IST is 00:10 UTC
    - cron: '10 0 * * *'
  # Allows manual trigger from GitHub Actions UI anytime
  workflow_dispatch:

jobs:
  scrape-and-update:
    name: Run Scrapers and Update Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./BE

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './BE/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium with OS dependencies
        run: |
          playwright install chromium --with-deps

      - name: Execute Scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          FOUNDIT_MSSOAT: ${{ secrets.FOUNDIT_MSSOAT }}
          FOUNDIT_MSSOCLIENT: ${{ secrets.FOUNDIT_MSSOCLIENT }}
        run: |
          python main.py --all
